server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Fix lỗi 404 khi F5 trang trên các ứng dụng Single Page App (React/Vue)
        try_files $uri $uri/ /index.html;
    }

    # Bỏ qua log cho các file tài nguyên tĩnh tĩnh để giảm tải I/O
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        log_not_found off;
    }
}
